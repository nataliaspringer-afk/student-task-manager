<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ontario Tech Checklist App</title>
    <link rel="stylesheet" href="./styling.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="stats-container">
            <div class="details">
                <h1>To-Do List App</h1>
                <p id="sidenote">Keep track of your tasks!</p>
                <div id="progress-bar">
                    <div id="progress"></div>
                </div>
            </div>
            <div class="stats-numbers">
                <p id="numbers">0</p>
            </div>
        </div>

        <form action="">
            <input id="taskInput" type="text" placeholder="Write your task here! ">
            <button id="newTask" type="submit">+</button>
        </form>

        <ul id="task-list"></ul>
    </div>
    <script src="./backend.js"></script>
    <script
            src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@4.4.0/tsparticles.confetti.bundle.min.js"></script>

</body>
</html>
